name: Publish package to NPM
on:
  workflow_dispatch:
  push:
    tags: ['v*.*', 'beta*.*']

# No token permissions by default; each job below is granted only what it uses.
permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
  unit-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
  e2e-linux:
    # Must cover what the e2e-linux job in the called workflow requests
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-linux.yml
  build-beta:
    if: ${{ startsWith(github.ref_name, 'beta') }}
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication with npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@aws'
      - name: Beta release (build and publish)
        run: |
          echo "Publishing beta release"
          npm ci
          npm run build
          npm publish --tag beta --access public
  build-prod:
    if: ${{ startsWith(github.ref_name, 'v') }}
    needs: [lint, unit-tests, e2e-linux]
    runs-on: macos-latest
    permissions:
      contents: write # Read the release and upload the demo app as a release asset
      id-token: write # Required for OIDC authentication with npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@aws'
      - name: Install dependencies and build
        run: npm ci && npm run build
      - name: Build demo app
        run: npm run packdemo
      - name: Get release info
        id: get_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          {
            echo "tag_name=${tag}"
            echo "html_url=$(jq -r .html_url <<< "$release")"
            echo "upload_url=$(jq -r .upload_url <<< "$release")"
          } >> "$GITHUB_OUTPUT"
      - name: Upload demo app to assets
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.get_release.outputs.upload_url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @./example/mynah-ui-demo.zip \
            "${UPLOAD_URL%%\{*}?name=mynah-ui-demo.zip"
      - name: Publish to npm
        run: npm publish --access public
      - name: Update Channels
        env:
          SLACK_ENDPOINT: ${{ secrets.SLACK_ENDPOINT }}
          VERSION: ${{ steps.get_release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.get_release.outputs.html_url }}
        run: |
          set -euo pipefail
          jq -nc --arg version "$VERSION" --arg url "$RELEASE_URL" '{version: $version, url: $url}' |
            curl --fail-with-body --silent --show-error --location --max-time 5 \
              -H "Content-Type: application/json" --data @- "$SLACK_ENDPOINT"
