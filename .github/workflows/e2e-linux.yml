name: Run E2E Tests (Linux)
on: workflow_call
jobs:
    e2e-linux:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          # Checkout the PR branch
          - name: Checkout Code
            uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            with:
              ref: ${{ github.event.pull_request.head.ref }}
              repository: ${{ github.event.pull_request.head.repo.full_name }}

          # Set up Docker Buildx
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            
          # Login to GitHub Container Registry
          - name: Login to GitHub Container Registry
            if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
            uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          # Image references must be lowercase, but github.repository may contain uppercase characters
          - name: Compute cache image ref
            if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
            run: echo "CACHE_REF=ghcr.io/${GITHUB_REPOSITORY,,}/mynah-ui-e2e:buildcache" >> "$GITHUB_ENV"

          # Build Docker image with caching (for non-fork PRs)
          - name: Build E2E tests Docker Image (with cache)
            if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
            uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
            with:
              context: .
              push: false
              load: true
              tags: mynah-ui-e2e:latest
              cache-from: type=registry,ref=${{ env.CACHE_REF }}
              cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max

          # Build Docker image without caching (for fork PRs)
          - name: Build E2E tests Docker Image (no cache)
            if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
            uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
            with:
              context: .
              push: false
              load: true
              tags: mynah-ui-e2e:latest

          # Run the Docker container
          - name: Run E2E tests Docker Container
            run: npm run docker:run
            env:
              WEBKIT_FORCE_COMPLEX_TEXT: 0
              WEBKIT_DISABLE_COMPOSITING_MODE: 1
              PLAYWRIGHT_BROWSERS_PATH: 0
    
          # Extract test results from Docker container
          - name: Extract test results from Docker container
            if: always()
            run: npm run docker:extract
              
          # Upload test results as artifact
          - name: Upload test results
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
            if: always()
            with:
              name: test-results
              path: ./ui-tests/__results__
              retention-days: 30
    report:
      needs: e2e-linux
      if: always() && github.event.pull_request.head.repo.full_name == github.repository
      uses: ./.github/workflows/test-report.yml
